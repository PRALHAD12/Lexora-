services:
  # 1. Lexora Frontend Web App
  web:
    build:
      context: ../lexora-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    container_name: lexora-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - lexora-network

  # 2. Lexora Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexora-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/lexora}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-us-east-1_XXXXXXXXX}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID:-xxxxxxxxxxxxxxxxxxxxxxxxxx}
      - COGNITO_APP_CLIENT_SECRET=${COGNITO_APP_CLIENT_SECRET:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=debug
      - RAG_SERVICE_URL=http://rag:8000
    depends_on:
      mongo:
        condition: service_healthy
      rag:
        condition: service_started
    restart: unless-stopped
    networks:
      - lexora-network

  # 3. Python RAG Microservice (Ollama + ChromaDB)
  rag:
    build:
      context: ../lexora-ai
      dockerfile: Dockerfile
    container_name: lexora-rag
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_CHAT_MODEL=lexora-origin:v1
      - CHROMA_DB_PATH=/app/chroma_db
      - NODE_BACKEND_URL=http://api:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../lexora-ai/chroma_db:/app/chroma_db
    restart: unless-stopped
    networks:
      - lexora-network

  # 4. MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: lexora-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - lexora-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  lexora-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  chroma_data:
    driver: local
