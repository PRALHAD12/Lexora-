name: Lexora Backend CI

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'ci/**' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Integration Tests
        env:
          NODE_ENV: test
          MONGODB_URI_TEST: mongodb://localhost:27017/lexora_test
          AWS_REGION: us-east-1
          COGNITO_USER_POOL_ID: us-east-1_TestPoolId
          COGNITO_APP_CLIENT_ID: test-client-id-123456
        run: npm test

  docker-build-check:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: lexora-backend:ci
